# ========== ADVAITAM LOCAL DEVELOPMENT — docker-compose.yml ==========  # change this line according to your company (rename to your project)
# Spins up Django + PostgreSQL + Redis locally with a single command.
#
# Usage:
#   docker compose up            # start all services
#   docker compose up -d         # start in background
#   docker compose down          # stop and remove containers
#   docker compose down -v       # also remove named volumes (wipes DB data)
#   docker compose logs -f web   # tail Django logs
#   docker compose exec web python manage.py createsuperuser
#   docker compose exec web python manage.py shell
#
# First run:
#   cp .env.example .env         # or copy from deploy/06-TEMPLATES/.env.prod.template
#   docker compose up

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine  # change this line according to your company (update PostgreSQL version if needed)
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-advaitam_db}       # change this line according to your company
      POSTGRES_USER:     ${DB_USER:-advaitam_user}     # change this line according to your company
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword123}  # change this line according to your company
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # expose to host for DB GUI tools (TablePlus, DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-advaitam_user} -d ${DB_NAME:-advaitam_db}"]  # change this line according to your company
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache / Session Store ────────────────────────────────────────────
  redis:
    image: redis:7-alpine  # change this line according to your company (update Redis version if needed)
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru  # change this line according to your company (adjust memory limit)
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Application ─────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env             # change this line according to your company (update to your env file name)
    environment:
      # Override DB/Redis to point at Docker service names (not localhost)
      DB_HOST:   db
      DB_PORT:   5432
      REDIS_URL: redis://redis:6379/0
      DEBUG:     "True"        # change this line according to your company (set to False to test production mode locally)
    ports:
      - "8000:8000"            # change this line according to your company (update port if needed)
    volumes:
      # Mount source code for live reload during development
      - .:/app
      - /app/.venv             # exclude venv from bind mount
      - /app/staticfiles       # exclude collected static from bind mount
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Override CMD to use Django dev server with auto-reload
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"  # change this line according to your company (update runserver host/port if needed)
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health/"]  # change this line according to your company (update health check URL)
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
