# Dependabot configuration file for GitHub
# Enables automatic security scanning and dependency updates
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python Dependencies — scans requirements-prod.txt in the repo root
  - package-ecosystem: "pip"
    directory: "/"            # change this line according to your company (update if requirements file is in a subdirectory)
    schedule:
      interval: "daily"       # change this line according to your company (options: daily, weekly, monthly)
      time: "03:00"           # change this line according to your company (update scan time to suit your timezone)
    open-pull-requests-limit: 5  # change this line according to your company (adjust how many PRs Dependabot can open)
    commit-message:
      prefix: "security:"    # change this line according to your company (update commit message prefix)
      include: "scope"
    allow:
      - dependency-type: "production"  # change this line according to your company (add "development" if you want dev deps updated too)
    pull-request-branch-name:
      separator: "/"
