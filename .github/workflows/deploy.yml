name: Deploy to AWS EC2  # change this line according to your company (rename workflow to match your project)

on:
  push:
    branches: [ main ]  # change this line according to your company (update to your main branch name)
  pull_request:
    branches: [ main ]  # change this line according to your company (update to your main branch name)

jobs:

  # ── Job 1: Lint + Code Quality ─────────────────────────────────────────────
  # Runs ruff (fast Python linter + formatter check).
  # Fails fast — no point running tests if the code has lint errors.
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'  # change this line according to your company (update to your Python version)

    - name: Install ruff
      run: pip install ruff

    - name: Run ruff linter
      run: ruff check . --output-format=github

    - name: Run ruff formatter check
      run: ruff format . --check


  # ── Job 2: Tests ───────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint       # Only run tests if lint passes

    services:
      postgres:
        image: postgres:16  # change this line according to your company (update to your PostgreSQL version)
        env:
          POSTGRES_DB: advaitam_test       # change this line according to your company
          POSTGRES_USER: postgres          # change this line according to your company
          POSTGRES_PASSWORD: postgres      # change this line according to your company
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'  # change this line according to your company (update to your Python version)

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-prod.txt
        pip install pytest pytest-django

    - name: Run migrations
      env:
        DEBUG: False
        SECRET_KEY: test-secret-key-not-used-in-production  # change this line according to your company
        DB_NAME: advaitam_test    # change this line according to your company
        DB_USER: postgres         # change this line according to your company
        DB_PASSWORD: postgres     # change this line according to your company
        DB_HOST: localhost
        DB_PORT: 5432
        USE_S3: False
        SECURE_SSL_REDIRECT: False
      run: python manage.py migrate

    - name: Run tests
      env:
        DEBUG: False
        SECRET_KEY: test-secret-key-not-used-in-production  # change this line according to your company
        DB_NAME: advaitam_test    # change this line according to your company
        DB_USER: postgres         # change this line according to your company
        DB_PASSWORD: postgres     # change this line according to your company
        DB_HOST: localhost
        DB_PORT: 5432
        USE_S3: False
        SECURE_SSL_REDIRECT: False
      run: pytest

    - name: Check Django
      env:
        DEBUG: False
        SECRET_KEY: test-secret-key-not-used-in-production  # change this line according to your company
        DB_NAME: advaitam_test    # change this line according to your company
        DB_USER: postgres         # change this line according to your company
        DB_PASSWORD: postgres     # change this line according to your company
        DB_HOST: localhost
        DB_PORT: 5432
        USE_S3: False
        SECURE_SSL_REDIRECT: False
      run: python manage.py check --deploy

  # ── Job 3: Deploy ─────────────────────────────────────────────────────────
  # Only runs on a push to main (not on pull_request).
  # SSHes into the EC2 instance, pulls latest code, installs deps,
  # runs migrations, collects static files, and gracefully reloads services.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'  # change this line according to your company (update branch name)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.AWS_EC2_PRIVATE_KEY }}  # change this line according to your company (update secret name in GitHub)
        HOST: ${{ secrets.AWS_EC2_HOST }}                # change this line according to your company (update secret name in GitHub)
        USER: ubuntu                                     # change this line according to your company (update EC2 SSH username)
      run: |
        mkdir -p ~/.ssh
        echo "$PRIVATE_KEY" > ~/.ssh/deploy_key.pem
        chmod 600 ~/.ssh/deploy_key.pem
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

        ssh -i ~/.ssh/deploy_key.pem $USER@$HOST << 'EOF'
          cd /home/advaitam/app            # change this line according to your company (update to your app directory on server)
          git pull origin main             # change this line according to your company (update to your branch name)
          source /home/advaitam/venv/bin/activate  # change this line according to your company (update to your venv path)
          pip install -r requirements-prod.txt     # change this line according to your company
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          # Graceful reload — in-flight requests finish before workers are replaced (zero downtime)
          # 'restart' kills workers immediately; 'reload' sends SIGHUP and waits for graceful_timeout
          sudo systemctl reload advaitam.service   # change this line according to your company (update to your systemd service name)
          sudo systemctl reload nginx
        EOF

